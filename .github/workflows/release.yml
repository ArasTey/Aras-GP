name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag may be repointed at a fix without cutting a new version, so
          # replace an existing release for the same tag instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "Aras-GP $GITHUB_REF_NAME" \
            --latest
