name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Entry points start and report a version
        run: |
          python -c "import main, manage, panel.app"
          python main.py --version
      - name: Unit tests
        run: pytest tests/ -q

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the rules that flag broken code, not style: the tree has never
      # been linted, so a broad ruleset would fail on day one and be ignored.
      - name: Ruff
        run: |
          pip install ruff
          ruff check . --select F,E9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Worker scripts parse
        run: |
          for f in deploy/cloudflare-worker/worker.js deploy/share-worker/worker.js; do
            node --check "$f"
          done

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image build used to copy config.json, which is gitignored, so it
      # only ever worked in a checkout that had already run the setup wizard.
      - name: Build image from a clean clone
        run: docker build -t aras-gp:ci .

  wheels:
    name: Wheels on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The install used to die on platforms where the newest cryptography has
      # no wheel: pip built the sdist and needed Rust. Resolving with
      # --only-binary proves every direct dependency has a prebuilt wheel for
      # this OS/interpreter, so a future pin bump cannot reintroduce that trap.
      - name: Every dependency resolves to a wheel
        run: >
          python -m pip download --only-binary=:all: --prefer-binary --no-deps
          -r requirements.txt -d wheel-check
      - name: 32-bit Windows resolves too
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        run: >
          python -m pip download --only-binary=:all: --prefer-binary --no-deps
          --platform win32 --python-version 310 --implementation cp
          --abi cp310 --abi abi3 --abi none
          -r requirements.txt -d wheel-check-win32
