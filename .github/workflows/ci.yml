name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Entry points start and report a version
        run: |
          python -c "import main, manage, panel.app"
          python main.py --version
      - name: Unit tests
        run: pytest tests/ -q

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the rules that flag broken code, not style: the tree has never
      # been linted, so a broad ruleset would fail on day one and be ignored.
      - name: Ruff
        run: |
          pip install ruff
          ruff check . --select F,E9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Worker scripts parse
        run: |
          for f in deploy/cloudflare-worker/worker.js deploy/share-worker/worker.js; do
            node --check "$f"
          done

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image build used to copy config.json, which is gitignored, so it
      # only ever worked in a checkout that had already run the setup wizard.
      - name: Build image from a clean clone
        run: docker build -t aras-gp:ci .
